[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastexport-jsonl"
version = "0.1.0"
description = "Streaming converter between git fast-export streams and JSON Lines"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "laallen8" }]

[tool.setuptools.packages.find]
include = ["fastexport_jsonl*"]
